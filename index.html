<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergaminho de Jutsus</title>
    <style>
        body { background-color: #f4ebd0; color: #4a2c11; font-family: 'Georgia', serif; text-align: center; margin: 0; padding: 20px; }
        .pergaminho { max-width: 700px; margin: 20px auto; background: #fffdf6; border: 10px solid #8b5a2b; border-radius: 4px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h1 { color: #8b2500; border-bottom: 2px dashed #8b5a2b; padding-bottom: 10px; text-transform: uppercase; margin-top: 0; }
        select { background: #fffdf6; color: #4a2c11; border: 2px solid #8b5a2b; padding: 12px; font-size: 1.1rem; border-radius: 6px; width: 100%; max-width: 400px; margin-bottom: 25px; cursor: pointer; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .bloco { background: #fdfaf2; border: 1px solid #dcd0b6; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bloco h3 { color: #8b2500; margin-top: 0; }
        .moldura { width: 100%; height: 250px; display: flex; align-items: center; justify-content: center; background: #f5f0e1; border-radius: 6px; overflow: hidden; border: 1px solid #e3dac9; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .info-texto { background: #fbf7eb; border-left: 5px solid #8b2500; padding: 15px; border-radius: 4px; text-align: left; margin: 25px auto; max-width: 600px; font-size: 1.1rem; line-height: 1.5; }
        button { background: #8b2500; color: white; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 12px rgba(139,37,0,0.3); }
        button:hover { background: #a02800; }
    </style>
</head>
<body>
    <div class="pergaminho">
        <h1>Pergaminho de Treinamento Ninja</h1>
        <p>Escolha um jutsu no menu abaixo para abrir os selos do pergaminho:</p>
        
        <select id="menuJutsu" onchange="trocarJutsu()">
            <option value="">-- Abrir Pergaminho --</option>
            <option value="fogo">Katon: Bola de Fogo</option>
            <option value="agua">Suiton: Dragão d'Água (Completo)</option>
            <option value="clones">Kage Bunshin: Clones das Sombras</option>
            <option value="transformacao">Henge no Jutsu (Transformação)</option>
            <option value="edotensei">Edo Tensei</option>
        </select>

        <div class="grid">
            <div class="bloco">
                <h3>Selo de Mão</h3>
                <div class="moldura">
                    <div id="msgSelo">Aguardando jutsu...</div>
                    <img id="telaSelo" src="" alt="Selo">
                </div>
            </div>
            <div class="bloco">
                <h3>Resultado Visual</h3>
                <div class="moldura">
                    <div id="msgEfeito">Aguardando jutsu...</div>
                    <img id="telaEfeito" src="" alt="Efeito">
                </div>
            </div>
        </div>

        <div class="info-texto">
            <p id="instrucao">Selecione uma técnica no menu de madeira acima para revelar as instruções de chakra.</p>
        </div>

        <button id="btnAcao" onclick="avancarPasso()">Iniciar Treino ▶</button>
    </div>

    <script>
        // CONFIGURAÇÃO COMPLETA DE TODOS OS JUTSUS
        const JUTSUS = {
            fogo: {
                fotos: ["cobra.png", "bode.png", "macaco.png", "javali.png", "cavalo.png", "tigre.png"],
                nomes: ["Cobra", "Bode", "Macaco", "Javali", "Cavalo", "Tigre"],
                resultado: "bola-de-fogo.jpg",
                texto: "Estilo Fogo! Concentre o chakra no peito e execute a sequência: Cobra ➡️ Bode ➡️ Macaco ➡️ Javali ➡️ Cavalo ➡️ Tigre."
            },
            agua: {
                fotos: [
                    "boi.png", "macaco.png", "lebre.png", "rato.png", "javali.png", "passaro.png", "boi.png", "cavalo.png", "passaro.png", "rato.png", 
                    "tigre.png", "cao.png", "tigre.png", "serpente.png", "boi.png", "carneiro.png", "serpente.png", "javali.png", "carneiro.png", "rato.png", 
                    "macaco.png", "passaro.png", "dragao.png", "passaro.png", "boi.png", "cavalo.png", "carneiro.png", "tigre.png", "serpente.png", "rato.png", 
                    "macaco.png", "lebre.png", "javali.png", "dragao.png", "carneiro.png", "rato.png", "boi.png", "macaco.png", "passaro.png", "rato.png", 
                    "carneiro.png", "passaro.png"
                ],
                nomes: [
                    "Boi", "Macaco", "Lebre", "Rato", "Javali", "Pássaro", "Boi", "Cavalo", "Pássaro", "Rato", 
                    "Tigre", "Cão", "Tigre", "Serpente", "Boi", "Carneiro", "Serpente", "Javali", "Carneiro", "Rato", 
                    "Macaco", "Pássaro", "Dragão", "Pássaro", "Boi", "Cavalo", "Carneiro", "Tigre", "Serpente", "Rato", 
                    "Macaco", "Lebre", "Javali", "Dragão", "Carneiro", "Rato", "Boi", "Macaco", "Pássaro", "Rato", 
                    "Carneiro", "Pássaro"
                ],
                resultado: "dragao-dagua.jpg",
                texto: "Estilo Água: A sequência lendária e completa do Dragão d'Água com todos os 42 selos mapeados!"
            },
            clones: {
                fotos: ["tigre.png"],
                nomes: ["Tigre (Selo Único)"],
                resultado: "clones.jpg",
                texto: "Clones das Sombras! Use o selo de concentração para dividir sua energia vital igualmente."
            },
            transformacao: {
                fotos: ["cachorro.png", "javali.png", "tigre.png"],
                nomes: ["Cachorro", "Javali", "Tigre"],
                resultado: "henge.jpg",
                texto: "Técnica de Transformação! Altere sua aparência física enganando os inimigos: Cachorro ➡️ Javali ➡️ Tigre."
            },
            edotensei: {
                fotos: ["rato.png", "boi.png", "macaco.png", "tigre.png"],
                nomes: ["Rato", "Boi", "Macaco", "Tigre"],
                resultado: "edotensei.jpg",
                texto: "Edo Tensei! Execute os selos necessários para o jutsu proibido: Rato ➡️ Boi ➡️ Macaco ➡️ Tigre."
            }
        };

        let selecionado = null;
        let etapa = 0;

        const menuJutsu = document.getElementById("menuJutsu");
        const telaSelo = document.getElementById("telaSelo");
        const telaEfeito = document.getElementById("telaEfeito");
        const msgSelo = document.getElementById("msgSelo");
        const msgEfeito = document.getElementById("msgEfeito");
        const instrucao = document.getElementById("instrucao");
        const btnAcao = document.getElementById("btnAcao");

        function trocarJutsu() {
            const id = menuJutsu.value;
            if (!id) { limparPergaminho(); return; }

            selecionado = JUTSUS[id];
            etapa = 0;

            telaEfeito.src = selecionado.resultado;
            telaEfeito.style.display = "block";
            msgEfeito.style.display = "none";

            telaSelo.style.display = "none";
            msgSelo.style.display = "block";
            msgSelo.innerText = "Clique no botão abaixo para ver a primeira posição de mão!";

            instrucao.innerText = selecionado.texto;
            btnAcao.innerText = "Iniciar Treino ▶";
        }

        function avancarPasso() {
            if (!selecionado) {
                alert("Por favor, selecione um jutsu no menu primeiro!");
                return;
            }

            if (etapa < selecionado.fotos.length) {
                telaSelo.src = selecionado.fotos[etapa];
                telaSelo.style.display = "block";
                msgSelo.style.display = "none";

                const nomeSelo = selecionado.nomes[etapa];
                instrucao.innerHTML = `<strong>PASSO ${etapa + 1} de ${selecionado.fotos.length}:</strong> Posicione as mãos no selo <strong>${nomeSelo.toUpperCase()}</strong>!`;
                
                etapa++;

                if (etapa === selecionado.fotos.length) {
                    btnAcao.innerText = "💥 Concluir Jutsu 💥";
                } else {
                    btnAcao.innerText = "Próximo Selo ▶";
                }
            } else {
                alert("✨ Executado com sucesso! Sincronia de chakra concluída. ✨");
                limparPergaminho();
            }
        }

        function limparPergaminho() {
            selecionado = null;
            etapa = 0;
            menuJutsu.value = "";
            telaSelo.style.display = "none";
            telaEfeito.style.display = "none";
            msgSelo.style.display = "block";
            msgEfeito.style.display = "block";
            msgSelo.innerText = "Aguardando jutsu...";
            msgEfeito.innerText = "Aguardando jutsu...";
            instrucao.innerText = "Selecione uma técnica no menu de madeira acima para revelar as instruções de chakra.";
            btnAcao.innerText = "Iniciar Treino ▶";
        }
    </script>
</body>
</html>
