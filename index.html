<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Ninja</title>
    <style>
        body { background-color: #12121a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #ff6a00; text-transform: uppercase; }
        select { background: #1c1c27; color: white; border: 2px solid #ff6a00; padding: 12px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 400px; margin-bottom: 20px; cursor: pointer; }
        .painel { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .card { background: #1c1c27; border-radius: 12px; padding: 15px; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card h3 { color: #ff6a00; }
        .wrapper { width: 100%; height: 260px; display: flex; align-items: center; justify-content: center; background: #14141f; border-radius: 8px; overflow: hidden; }
        img { max-width: 100%; max-height: 100%; display: none; }
        .instrucoes { background: #1c1c27; border-left: 5px solid #ff6a00; padding: 15px; border-radius: 4px; text-align: left; margin: 20px auto; max-width: 620px; }
        button { background: linear-gradient(135deg, #ff8c00, #ff5500); color: white; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pergaminho Ninja Digital</h1>
        <p>Selecione um jutsu abaixo para iniciar o seu treinamento!</p>
        
        <select id="selectJutsu" onchange="atualizarJutsu()">
            <option value="">-- Escolha um Jutsu --</option>
            <option value="bolaFogo">Katon: Bola de Fogo</option>
            <option value="dragaoAgua">Suiryudan: Dragão d'Água</option>
            <option value="clones">Kage Bunshin: Clones das Sombras</option>
            <option value="rasengan">Rasengan</option>
        </select>

        <div class="painel">
            <div class="card">
                <h3>Selo de Mão Atual</h3>
                <div class="wrapper">
                    <div id="placeSelo">Selecione um jutsu acima...</div>
                    <img id="imgSelo" src="" alt="Selo">
                </div>
            </div>
            <div class="card">
                <h3>Demonstração</h3>
                <div class="wrapper">
                    <div id="placeEfeito">Selecione um jutsu acima...</div>
                    <img id="imgEfeito" src="" alt="Efeito">
                </div>
            </div>
        </div>

        <div class="instrucoes">
            <p id="txtInstrucao">Escolha uma técnica no menu acima para abrir o pergaminho digital.</p>
        </div>

        <button id="btnAvancar" onclick="avancarPasso()">Iniciar Sequência ▶</button>
    </div>

    <script>
        const JUTSUS = {
            bolaFogo: {
                sequencia: ["https://postimg.cc", "https://postimg.cc"],
                nomes: ["Javali", "Tigre"],
                efeito: "https://postimg.cc",
                txt: "Jutsu Estilo Fogo! Faça os selos Javali e Tigre na ordem para moldar o chakra."
            },
            dragaoAgua: {
                sequencia: ["https://postimg.cc", "https://postimg.cc", "https://postimg.cc", "https://postimg.cc", "https://postimg.cc"],
                nomes: ["Boi", "Macaco", "Rato", "Javali", "Tigre"],
                efeito: "https://postimg.cc",
                txt: "Jutsu Dragão d'Água! Uma combinação longa usando os selos que você possui para moldar o elemento água."
            },
            clones: {
                sequencia: ["https://postimg.cc"],
                nomes: ["Selo de Concentração"],
                efeito: "https://postimg.cc",
                txt: "Kage Bunshin no Jutsu! Concentre sua energia para criar clones físicos idênticos dividindo seu chakra."
            },
            rasengan: {
                sequencia: ["https://postimg.cc", "https://postimg.cc"],
                nomes: ["Rotação", "Estabilização"],
                efeito: "https://postimg.cc",
                txt: "Treino de Controle de Chakra Avançado! Rotacione o chakra na palma da mão com velocidade e contenção estável."
            }
        };

        let jutsuSelecionado = null;
        let passoAtual = 0;

        const menu = document.getElementById("selectJutsu");
        const fotoSelo = document.getElementById("imgSelo");
        const fotoEfeito = document.getElementById("imgEfeito");
        const textoSelo = document.getElementById("placeSelo");
        const textoEfeito = document.getElementById("placeEfeito");
        const caixaTexto = document.getElementById("txtInstrucao");
        const botao = document.getElementById("btnAvancar");

        function atualizarJutsu() {
            const chave = menu.value;
            if (!chave) {
                resetar();
                return;
            }

            jutsuSelecionado = JUTSUS[chave];
            passoAtual = 0;

            fotoEfeito.src = jutsuSelecionado.efeito;
            fotoEfeito.style.display = "block";
            textoEfeito.style.display = "none";

            fotoSelo.style.display = "none";
            textoSelo.style.display = "block";
            textoSelo.innerText = "Clique no botão abaixo para ver o primeiro selo!";

            caixaTexto.innerText = jutsuSelecionado.txt;
            botao.innerText = "Iniciar Sequência ▶";
        }

        function avancarPasso() {
            if (!jutsuSelecionado) {
                alert("Por favor, selecione um jutsu no menu acima primeiro!");
                return;
            }

            if (passoAtual < jutsuSelecionado.sequencia.length) {
                fotoSelo.src = jutsuSelecionado.sequencia[passoAtual];
                fotoSelo.style.display = "block";
                textoSelo.style.display = "none";

                const nomeSelo = jutsuSelecionado.nomes[passoAtual];
                caixaTexto.innerHTML = `<strong>PASSO ${passoAtual + 1}:</strong> Faça o selo <strong>${nomeSelo.toUpperCase()}</strong> com as mãos!`;
                
                passoAtual++;

                if (passoAtual === jutsuSelecionado.sequencia.length) {
                    botao.innerText = "🔥 Finalizar Técnica 🔥";
                } else {
                    botao.innerText = "Próximo Selo ▶";
                }
            } else {
                alert("✨ JUTSU CONCLUÍDO COM SUCESSO! CHAKRA LIBERADO PERFEITAMENTE! ✨");
                resetar();
            }
        }

        function resetar() {
            jutsuSelecionado = null;
            passoAtual = 0;
            menu.value = "";
            fotoSelo.style.display = "none";
            fotoEfeito.style.display = "none";
            textoSelo.style.display = "block";
            textoEfeito.style.display = "block";
            textoSelo.innerText = "Selecione um jutsu acima...";
            textoEfeito.innerText = "Selecione um jutsu acima...";
            caixaTexto.innerText = "Escolha uma técnica no menu acima para abrir o pergaminho digital.";
            botao.innerText = "Iniciar Sequência ▶";
        }
    </script>
</body>
</html>
